<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#262a32"/>
      <stop offset="52%" stop-color="#15171c"/>
      <stop offset="100%" stop-color="#07080a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBCB72"/>
      <stop offset="50%" stop-color="#CFB058"/>
      <stop offset="100%" stop-color="#A2823A"/>
    </linearGradient>
    <radialGradient id="goldCore" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#F6E099"/>
      <stop offset="58%" stop-color="#DBBA5E"/>
      <stop offset="100%" stop-color="#A2823A"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- nucleus halo -->
  <circle cx="512" cy="512" r="135" fill="#D9B85B" opacity="0.32" filter="url(#softGlow)"/>

  <!-- orbits -->
  <g fill="none" stroke="url(#gold)" stroke-width="11" opacity="0.94">
    <g transform="rotate(0 512 512)"><ellipse cx="512" cy="512" rx="342" ry="140"/></g>
    <g transform="rotate(60 512 512)"><ellipse cx="512" cy="512" rx="342" ry="140"/></g>
    <g transform="rotate(120 512 512)"><ellipse cx="512" cy="512" rx="342" ry="140"/></g>
  </g>

  <!-- electrons -->
  <g fill="url(#gold)" filter="url(#glow)">
    <g transform="rotate(0 512 512)"><circle cx="854" cy="512" r="27"/><circle cx="170" cy="512" r="21"/></g>
    <g transform="rotate(60 512 512)"><circle cx="854" cy="512" r="22"/><circle cx="170" cy="512" r="27"/></g>
    <g transform="rotate(120 512 512)"><circle cx="854" cy="512" r="25"/><circle cx="170" cy="512" r="22"/></g>
  </g>

  <!-- nucleus -->
  <circle cx="512" cy="512" r="74" fill="url(#goldCore)" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="32" fill="#0a0b0d"/>
  <circle cx="512" cy="512" r="14" fill="url(#goldCore)"/>
</svg>
